<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluxo — Quadro Kanban</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Crect x='7' y='8' width='4' height='16' rx='1.5' fill='white'/%3E%3Crect x='14' y='8' width='4' height='10' rx='1.5' fill='white'/%3E%3Crect x='21' y='8' width='4' height='13' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="board-switcher">
        <button class="brand" id="board-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="Trocar de quadro">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="4" width="5" height="16" rx="1.6"/>
              <rect x="10" y="4" width="5" height="10" rx="1.6"/>
              <rect x="17" y="4" width="4" height="13" rx="1.6"/>
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-title">
              Fluxo
              <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </span>
            <span class="brand-sub" id="board-name">Meu quadro</span>
          </span>
        </button>

        <div class="board-menu" id="board-menu" role="menu" hidden>
          <p class="menu-label">Seus quadros</p>
          <div id="board-list"></div>
          <button class="board-new" id="board-new" type="button">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Novo quadro
          </button>
        </div>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.2-3.2"/>
        </svg>
        <input id="search" type="search" placeholder="Buscar cartões, etiquetas..." autocomplete="off" aria-label="Buscar cartões">
      </div>

      <div class="topbar-actions">
        <span class="stat" id="stat">0 cartões</span>
        <button class="btn" id="export-btn" title="Baixar o quadro em JSON">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/>
          </svg>
          <span>Exportar</span>
        </button>
        <button class="btn" id="import-btn" title="Carregar um quadro em JSON">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 20h16"/>
          </svg>
          <span>Importar</span>
        </button>
        <button class="btn btn-primary" id="add-column-btn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>Coluna</span>
        </button>
      </div>

      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </header>

    <main class="board" id="board" aria-label="Quadro Kanban"></main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <form class="modal" id="card-form" novalidate>
      <header class="modal-head">
        <h2>Editar cartão</h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </header>

      <div class="modal-body">
        <label class="field">
          <span>Título</span>
          <input id="f-title" type="text" maxlength="120" autocomplete="off" required>
        </label>

        <label class="field">
          <span>Descrição</span>
          <textarea id="f-desc" rows="3" maxlength="600" placeholder="Detalhes, links, critérios de aceite..."></textarea>
        </label>

        <div class="field-row">
          <label class="field">
            <span>Prioridade</span>
            <select id="f-priority">
              <option value="low">Baixa</option>
              <option value="medium">Média</option>
              <option value="high">Alta</option>
            </select>
          </label>
          <label class="field">
            <span>Prazo</span>
            <input id="f-due" type="date">
          </label>
        </div>

        <label class="field">
          <span>Etiquetas</span>
          <input id="f-tags" type="text" placeholder="design, urgente" autocomplete="off">
        </label>

        <div class="field">
          <span>Checklist <em id="cl-progress">nenhum item</em></span>
          <ul class="checklist" id="checklist"></ul>
          <div class="checklist-add">
            <input id="cl-input" type="text" placeholder="Novo item..." autocomplete="off" maxlength="120">
            <button type="button" class="btn" id="cl-add">Adicionar</button>
          </div>
        </div>
      </div>

      <footer class="modal-actions">
        <button type="button" class="btn btn-danger-ghost" id="modal-delete">Excluir</button>
        <div class="spacer"></div>
        <button type="button" class="btn" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </footer>
    </form>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
